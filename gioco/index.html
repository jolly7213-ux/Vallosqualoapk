<meta charset="utf-8">
<title>Vallo Squalo Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vallo Squalo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: schermata a tutta altezza, si scorre col dito tra le stanze: ingresso con la porta, poi un vaso per stanza. HUD a icone in alto, carrello (menu) e ritratto in basso. */
:root{
  --bg:#0a100c; --panel:#18241d; --panel2:#213229; --line:#33493b;
  --fg:#f1f7ee; --muted:#9db3a2; --leaf:#5fd45a; --leaf2:#2f8f3a; --gold:#f2c14e; --bad:#e2574c;
  --display:"Bowlby One","Arial Black",sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 30%,#14201a,#060a07);color:var(--fg);font:600 15px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{display:block;max-width:100%}
#app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:#101914;box-shadow:0 0 60px rgba(0,0,0,.7)}
.stroke{-webkit-text-stroke:4px #08100a;paint-order:stroke fill;text-shadow:0 3px 0 #08100a;font-family:var(--display);font-weight:400}

/* mondo scorrevole */
.world{position:absolute;inset:0;background:#d9d5cd var(--apt) no-repeat left bottom/auto 100%;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.world::-webkit-scrollbar{display:none}
.room{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#1a241e center bottom/cover no-repeat;overflow:hidden}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 60%,rgba(0,0,0,.5));pointer-events:none}
.wall0{background-image:var(--room0)} .wall1{background-image:var(--room1)} .wall2{background-image:var(--room2)} .wall3{background-image:var(--room3)}
.hall{position:relative;flex:0 0 min(55vw,280px);height:100%}
#big{position:relative;display:flex;align-items:stretch;height:100%;min-width:max-content;padding-right:30px;background:#d9d5cd var(--apt) repeat-x left bottom/auto 100%}
.pslot{contain:layout style;position:relative;flex:0 0 calc(min(46vw,230px,26vh) + 34px);height:100%}
.shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18))}
.hall .door{position:absolute;left:0;bottom:29%;width:min(53vw,270px);filter:drop-shadow(0 14px 14px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(242,193,78,.15));z-index:1}
.xroom{position:relative;flex:0 0 min(46vw,230px);height:100%}
.xdoor{position:absolute;right:0;bottom:29%;width:min(44vw,220px);cursor:pointer;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(120,190,255,.45));z-index:1}
.xdoor.lock{filter:grayscale(.6) brightness(.8) drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.xdoor.knock{animation:shake .5s 2}
.xlab{position:absolute;right:0;bottom:calc(29% + min(44vw,220px) * 1.447 + 8px);width:min(44vw,220px);text-align:center;font:800 15px/1.1 var(--display);color:#bfe2ff;-webkit-text-stroke:3px #08100a;paint-order:stroke fill;pointer-events:none}
.xlab.lock{color:#ffcf6a}
.zc{--apt:url("art/apt2.jpg")}
.zc .joint{width:78px;height:70px}
.psyfx{position:absolute;inset:0;display:none;pointer-events:none;-webkit-mask:url(art/powder.png) center/contain no-repeat;mask:url(art/powder.png) center/contain no-repeat;background:linear-gradient(115deg,#ff2d95,#ffe600,#2dff8a,#2dd4ff,#8b5cff,#ff2d95,#ffe600);background-size:300% 100%;opacity:.9;animation:psyslide 1.4s linear infinite}
.joint.psy .psyfx{display:block}
.joint.psy{filter:drop-shadow(0 0 10px #ff2d95) drop-shadow(0 0 18px #2dd4ff)}
@keyframes psyslide{to{background-position:-300% 0}}
.psyov{position:absolute;inset:0;z-index:39;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s}
.psyov.on{opacity:.24}
.psyov::before{content:"";position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:conic-gradient(#ff2d95,#ffe600,#2dff8a,#2dd4ff,#8b5cff,#ff2d95)}
.psyov.on::before{animation:psyspin 9s linear infinite;will-change:transform}
@keyframes psyspin{to{transform:rotate(360deg)}}

#raidOv{z-index:80;background:rgba(8,2,14,.9)}
.sirens{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sirens i{position:absolute;top:-30%;width:75%;height:160%}
.sirens .r{left:-30%;background:radial-gradient(ellipse at 40% 20%,rgba(255,30,60,.85),transparent 62%);animation:sirA .7s steps(1) infinite}
.sirens .b{right:-30%;background:radial-gradient(ellipse at 60% 20%,rgba(40,110,255,.85),transparent 62%);animation:sirB .7s steps(1) infinite}
@keyframes sirA{0%{opacity:1}50%{opacity:.08}}
@keyframes sirB{0%{opacity:.08}50%{opacity:1}}
.beacon{position:absolute;top:0;width:54px;height:30px;border-radius:0 0 27px 27px;z-index:2}
.beacon.r{left:12%;background:#ff2a4d;box-shadow:0 0 30px 12px rgba(255,42,77,.8);animation:sirA .7s steps(1) infinite}
.beacon.b{right:12%;background:#2f7bff;box-shadow:0 0 30px 12px rgba(47,123,255,.8);animation:sirB .7s steps(1) infinite}
.raid{position:relative;z-index:3;width:100%;max-width:380px;text-align:center;animation:raidIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes raidIn{from{transform:translateY(60px) scale(.8);opacity:0}}
.raid .badge{display:inline-block;background:#1b3a8a;color:#fff;font-family:var(--display);letter-spacing:.2em;font-size:12px;padding:4px 14px;border-radius:999px;border:2px solid #7ea6ff;margin-bottom:8px}
.raid .cop{width:min(190px,48vw);aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid #4d86ff;box-shadow:0 0 0 4px #ff2a4d,0 0 40px rgba(77,134,255,.8);background:var(--panel2);animation:copshake .35s 3}
@keyframes copshake{25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
.raid .nm{font-family:var(--display);font-size:22px;margin:8px 0 6px;color:#cfe0ff;-webkit-text-stroke:4px #08100a;paint-order:stroke fill}
.raid .bub{position:relative;background:#fff;color:#161616;border-radius:18px;padding:12px 14px;font-family:var(--display);font-size:clamp(17px,5vw,22px);line-height:1.15;margin:6px 6px 14px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.raid .bub::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:#fff}
.raid .acts{display:flex;flex-direction:column;gap:9px}
.raid .acts .btn{font-size:16px;padding:12px 14px}
.raid .btn.bad{background:linear-gradient(180deg,#e0574d,#a02520);border-color:#ff8b80;color:#fff}
.raid .btn.blue{background:linear-gradient(180deg,#4d86ff,#2457c9);border-color:#9bbcff;color:#fff}
.mg-t{font-family:var(--display);font-size:26px;margin:4px 0 10px;color:#fff;-webkit-text-stroke:4px #08100a;paint-order:stroke fill}
.mg-track{position:relative;height:46px;border-radius:23px;background:#11151f;border:3px solid #4d86ff;overflow:hidden;touch-action:manipulation}
.mg-zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#6dff6d,#1f9d2e);box-shadow:0 0 16px #6dff6d}
.mg-needle{position:absolute;top:-4px;bottom:-4px;width:8px;margin-left:-4px;background:#fff;border-radius:4px;box-shadow:0 0 10px #fff}
.mg-dots{display:flex;justify-content:center;gap:12px;margin:12px 0;font-size:30px;min-height:38px}
.raid .btn.stop{font-family:var(--display);font-size:26px;padding:14px;width:100%}
.mg-flash{font-family:var(--display);font-size:24px;min-height:30px;margin-top:6px}
.jail{position:relative;z-index:3;width:100%;max-width:380px;text-align:center;overflow:hidden;border-radius:22px;padding:20px 8px 18px;background:rgba(10,10,14,.7)}
.jail .bars{position:absolute;inset:0;display:flex;justify-content:space-around;pointer-events:none;z-index:1;opacity:.75}
.jail .bars i{width:14px;height:100%;background:linear-gradient(90deg,#4a4f5a,#c9ced8,#4a4f5a);border-radius:7px;transform:translateY(-110%);animation:barDrop .55s cubic-bezier(.3,1.5,.5,1) forwards}
.jail .bars i:nth-child(2){animation-delay:.08s}.jail .bars i:nth-child(3){animation-delay:.16s}.jail .bars i:nth-child(4){animation-delay:.24s}.jail .bars i:nth-child(5){animation-delay:.32s}.jail .bars i:nth-child(6){animation-delay:.4s}
@keyframes barDrop{to{transform:none}}
.jail .cuffs{position:relative;z-index:3;width:130px;height:90px;display:inline-block;animation:cuffs 1s ease-in-out .6s infinite alternate;transform-origin:top center;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
@keyframes cuffs{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.jail .stamp{position:relative;z-index:3;font-family:var(--display);font-size:clamp(26px,8vw,38px);line-height:1;color:#ff3b3b;-webkit-text-stroke:5px #08100a;paint-order:stroke fill;margin:6px 0 10px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .8s both}
@keyframes stamp{from{transform:rotate(-6deg) scale(3.2);opacity:0}}
.jail .loss{position:relative;z-index:3;color:#ffd0d0;font-weight:800;margin-bottom:14px;animation:stamp .4s 1.2s both}
.jail .btn{position:relative;z-index:3}
.cop-out{animation:copout .6s ease-in forwards}
@keyframes copout{to{transform:translateX(120%) rotate(12deg);opacity:0}}
.zc .cart{width:124px;height:56px}
.zc .cart .cimg{border-radius:10px}
.zc .pstage{width:calc(var(--u) * .8)}
.hall .door.knock{animation:shake .5s 2}
@keyframes shake{25%{transform:translateX(-6px) rotate(-.6deg)}75%{transform:translateX(6px) rotate(.6deg)}}
.hall .mat{position:absolute;left:0;bottom:14%;width:min(50vw,250px);z-index:1}
#custs{position:absolute;left:12px;bottom:17%;z-index:3;display:flex;flex-direction:column-reverse;gap:10px}
.cav{position:relative;width:78px;background:none;border:0;padding:0;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.cav .face{width:74px;height:74px;border-radius:50%;object-fit:cover;background:var(--panel2);border:4px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:26px;overflow:hidden;animation:wob 1.4s infinite;box-shadow:0 8px 12px rgba(0,0,0,.6),inset 0 -8px 12px rgba(0,0,0,.25)}
@keyframes wob{50%{transform:scale(1.07)}}
.cav .q{position:absolute;right:-2px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#201600;font-family:var(--display);font-size:15px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.cav .pat{display:block;height:5px;background:#0b130f;border-radius:5px;overflow:hidden;margin-top:5px}
.cav .pat i{display:block;height:100%;width:var(--w,100%);background:var(--gold)}
.rnum{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 118px);text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000;z-index:2}

/* vaso con pianta */
.pstage{--u:min(46vw,230px,26vh);position:absolute;left:50%;bottom:20%;width:var(--u);transform:translateX(-50%);background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;z-index:2}
.potwrap{position:relative;width:100%;aspect-ratio:600/520}
.potwrap img.pot{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.pstage .stand{width:92%;margin:-9% auto 0;filter:drop-shadow(0 18px 12px rgba(0,0,0,.6))}
.pstage:active .potwrap{transform:scale(.98)}
.plantbox{will-change:transform;backface-visibility:hidden;position:absolute;left:50%;top:22.7%;width:105%;aspect-ratio:800/1100;transform:translate(-50%,-96%) scale(var(--s,1));transform-origin:50% 96%;transition:transform 1s linear;pointer-events:none}
.plantbox img{width:100%;height:100%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.35))}
.pstage.ready .plantbox{animation:breathe 1.4s ease-in-out infinite}
.pstage.ready .plantbox img{filter:drop-shadow(0 0 16px rgba(160,255,120,.95)) drop-shadow(0 0 4px rgba(255,255,200,.8))}
@keyframes breathe{50%{transform:translate(-50%,-96%) scale(1.025,1.04)}}
.pstage.locked .potwrap img.pot{filter:grayscale(.75) brightness(.55) drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.potlogo{position:absolute;left:50%;top:35%;transform:translateX(-50%) rotate(-2deg);display:flex;align-items:center;gap:4px;padding:3px 7px 3px 5px;border-radius:6px;background:linear-gradient(180deg,#e8322b,#a81914);border:1.5px solid #f6e7c8;box-shadow:0 2px 3px rgba(0,0,0,.5);pointer-events:none;z-index:2;width:56%;box-sizing:border-box}
.potlogo i{font-style:normal;font-size:13px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.potlogo b{font:800 9px/1.05 'Baloo 2','Fredoka',system-ui,sans-serif;color:#fff6dd;letter-spacing:.2px;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.45);text-align:center;flex:1}
.info{position:absolute;left:0;right:0;top:56%;display:flex;flex-direction:column;align-items:center;gap:3px}
.lab{white-space:nowrap;background:rgba(8,14,10,.78);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:4px 14px;font-size:14px;font-weight:800}
.lab.go{background:linear-gradient(180deg,#58d052,#2b8a35);border-color:#7cf073}
.lab em{display:block;font-style:normal;font-family:var(--display);color:var(--gold);font-size:20px;font-weight:400}
.bar{width:64%;height:10px;background:rgba(0,0,0,.7);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(180deg,#8cf085,var(--leaf2))}
.fz{position:absolute;right:-6%;top:-30%;font-size:26px}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:flex-start;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 24px;background:linear-gradient(180deg,rgba(20,26,22,.55) 0%,rgba(20,26,22,.3) 55%,rgba(20,26,22,0));pointer-events:none}
.hud>*{pointer-events:auto}
.lv{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.lv .col{display:flex;flex-direction:column;align-items:center;min-width:0}
.lvl-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;color:#b9f3a8}
.leafbar{position:relative;width:78px;height:62px;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.leafbar .base,.leafbar .fill{position:absolute;inset:0;-webkit-mask:var(--leafurl) center/contain no-repeat;mask:var(--leafurl) center/contain no-repeat}
.leafbar .base{background:#e9efe8}
.leafbar .fill{background:linear-gradient(180deg,#8cf085,#2f8f3a);clip-path:inset(calc(100% - var(--p,0%)) 0 0 0);transition:clip-path .4s}
.xp{font-size:17px;color:#b9f3a8}
.rank{font-size:10px;color:#fff;font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:0 1px 3px #000;max-width:110px;text-align:center;line-height:1.1}
.res{display:flex;flex-direction:column;align-items:center;width:62px}
.res .mimg{width:60px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.res .gimg{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.res svg{width:52px;height:46px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.res b{font-size:16px;color:var(--gold)}
.res.g b{color:#7cf4d0}
.pause{background:none;border:0;padding:0;width:56px;height:56px;margin-top:2px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}

/* barra in basso */
.bar2{position:absolute;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:34px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0));pointer-events:none}
.bar2>*{pointer-events:auto}
.cart{justify-self:start;background:none;border:0;padding:0;width:58px;height:70px;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 5px 4px rgba(0,0,0,.6));transition:transform .1s}
.joint{position:relative;justify-self:end;background:none;border:0;padding:0;width:112px;height:56px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.6));transition:transform .1s}
.joint .jimg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.joint .jt{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:12px;font-family:var(--display);color:#ffb15a;-webkit-text-stroke:3px #08100a;paint-order:stroke fill;white-space:nowrap}
.joint.on{animation:ring 1.2s ease-in-out infinite}
.joint.off{filter:grayscale(.8) brightness(.7) drop-shadow(0 5px 4px rgba(0,0,0,.6))}
.cart:active,.portrait:active,.joint:active{transform:scale(.93)}
.cart .cimg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.portrait{position:relative;width:92px;height:92px;border-radius:50%;border:0;padding:5px;background:conic-gradient(#fff 0 50%,#3aa0ff 0 100%);filter:drop-shadow(0 5px 5px rgba(0,0,0,.65))}
.portrait img.pimg{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--panel);border:3px solid #111}
.portrait.alert{background:conic-gradient(var(--gold) 0 100%);animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08)}}
.portrait .pbadge{position:absolute;right:-4px;top:-4px;min-width:28px;height:28px;border-radius:14px;background:var(--bad);display:grid;place-items:center;font-family:var(--display);font-size:15px;padding:0 6px;border:2px solid #fff}
.portrait .pbadge:empty{display:none}
.status{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px}
.status .pill{background:rgba(8,14,10,.78);border:1px solid var(--line);border-radius:20px;padding:4px 12px;display:flex;gap:8px;align-items:center}
.status .pill button{background:none;border:0;color:var(--bad);font-weight:800}
.hint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 134px);z-index:11;text-align:center;font-size:13px;pointer-events:none}
.hint:not(:empty){background:rgba(8,14,10,.85);border:1px solid var(--line);border-radius:20px;padding:6px 14px;width:fit-content;margin:0 auto;max-width:100%}

/* schede e menu */
.row{display:grid;gap:6px}
.card{position:relative;text-align:left;background:linear-gradient(180deg,#2a4033,#1d2e24);border:2px solid var(--line);border-radius:16px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.card.sel{border-color:var(--leaf);background:linear-gradient(180deg,#355a40,#27402f)}
.card .n{font-weight:800;font-size:14px;line-height:1.15}
.card .d{font-size:12px;color:var(--muted)}
.card .p{font-size:13px;color:var(--gold);font-weight:800}
.card.lock{opacity:.5;cursor:not-allowed}
.card .own{position:absolute;right:8px;top:6px;font-family:var(--display);font-size:15px;color:var(--leaf)}
.card .add{margin-top:4px;border:1px solid var(--line);background:#0e1812;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;color:var(--gold)}
.hint2{font-size:12px;color:var(--muted);margin-top:8px}
.chip{background:linear-gradient(180deg,#223329,#17231c);border:1px solid var(--line);border-radius:20px;padding:6px 14px;display:inline-flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.chip small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.chip b{font-size:20px;font-family:var(--display);font-weight:400;color:var(--gold)}

    floatText("-" + fmt(sc) + " " + CONFIG.currency, el, "bad"); sfx("plant"); progress("plant", 1); save(); render(); return;
  }

    floatText("+" + gain + " g", el); flyFx(el, $("grams"), "bud", Math.min(8, 3 + Math.round(gain / 10)), ""); sfx("harvest"); vib(25); progress("harvest", 1); save(); render(); return;

function labStartPour(id, btn) {

  labPourIv = setInterval(() => {
    const k = Math.min(1, (now() - t0) / 1000 / cfg.pourRamp), rate = cfg.pourRateMin + (cfg.pourRateMax - cfg.pourRateMin) * k;
    const room = cfg.potCap - potTotal(), have = L.proc[id] || 0, amt = Math.min(rate * .05, have, room);

function circleTrack(el, turns, onP) {
  let last = null, acc = 0, cx = 0, cy = 0;
  const ang = e => Math.atan2(e.clientY - cy, e.clientX - cx);
  el.style.touchAction = "none";
  el.onpointerdown = e => { const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; last = ang(e); try { el.setPointerCapture(e.pointerId); } catch (x) {} };
  el.onpointermove = e => {
    if (last == null) return; const a = ang(e); let d = a - last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; last = a;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 12) return; acc += Math.abs(d); onP(Math.min(1, acc / (2 * Math.PI * turns)), a);
  };
  el.onpointerup = el.onpointercancel = () => { last = null; };
}

function raidMinigame(cop) {
  const ov = $("raidOv"), ra = ov.querySelector(".raid");

  const stop = () => {

function raidResult(win, cop) {

  if (win) {
    raidSiren(false); sfx("mission"); addStat("raidWin", 1); vib([60, 40, 60]);
    ov.innerHTML = raidFrame('<div class="raid">' + copHtml(cop) + '<div class="bub">' + P.winLine + '</div><button class="btn go" data-r="ok" style="width:100%;font-size:17px;padding:12px">😮‍💨 Che paura… si sono girati!</button></div>');
    ov.querySelector(".cop").style.animation = "none"; return;
  }
  const lostMoney = Math.floor(G.money * P.losePct), lostG = goodsTotal();
  G.money -= lostMoney; seizeGoods(); addStat("raidLost", 1); vib([200, 80, 200]); save();
  raidSiren(false); [220, 180, 140].forEach((f, i) => setTimeout(() => beep(f, .3, "square"), i * 220));
  ov.innerHTML = raidFrame('<div class="jail"><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="cuffs"><svg viewBox="0 0 130 90" width="130" height="90"><g fill="none" stroke="#dfe5ee" stroke-width="9" stroke-linecap="round"><circle cx="30" cy="56" r="22"/><circle cx="100" cy="56" r="22"/></g><g fill="#9aa3b2" stroke="#2b3140" stroke-width="3"><rect x="48" y="8" width="34" height="18" rx="6"/><rect x="54" y="24" width="8" height="14"/><rect x="68" y="24" width="8" height="14"/></g><g fill="#2b3140"><circle cx="30" cy="56" r="5"/><circle cx="100" cy="56" r="5"/></g></svg></div><div class="stamp">' + P.jailText + '</div><div class="loss">Persi ' + fmt(lostMoney) + ' ' + CONFIG.currency + ' (' + Math.round(P.losePct * 100) + '%) e tutta la merce (' + fmt(lostG) + ' g)</div><button class="btn bad" data-r="ok" style="width:100%;font-size:17px;padding:12px">Ahia…</button></div>');
  render();
}
$("raidOv").addEventListener("click", e => {
  const b = e.target.closest("[data-r]"); if (!b) return; const a = b.dataset.r, P = CONFIG.police, ov = $("raidOv");
  const cop = P.cops[(+ov.dataset.cop || 0) % P.cops.length];
  if (a === "game") { raidSiren(false); return raidMinigame(cop); }
  if (a === "pay") { const x = Math.floor(G.money * P.payPct); G.money -= x; sfx("buy"); addStat("raidPay", 1); say("Hai pagato " + fmt(x) + " " + CONFIG.currency + ". Gli sbirri se ne vanno."); return raidClose(); }
  if (a === "no") { const g = goodsTotal(); seizeGoods(); addStat("raidLost", 1); beep(160, .4, "square"); say("Sequestrati " + fmt(g) + " g di merce!"); return raidClose(); }
  if (a === "ok") return raidClose();
});
let last = now();
setInterval(() => {
  const t = now(), dt = (t - last) / 1000; last = t;
  if (!playing || paused) return;
  if (raidOpen) return;
  addStat("time", Math.min(dt, 1));
  tickPlots();
  if (G.lab && G.lab.pot && G.lab.pot.boilEnd) { const bp = G.lab.pot; if (t >= bp.boilEnd && !bp.notified) { bp.notified = true; save(); sfx("mission"); if (!labOpen) say("🔔 La pentola nel furgoncino ha finito di bollire!"); renderCamper(); if (labOpen) renderLab(); } else if (labOpen && t < bp.boilEnd) labTimerUI(); }
  ["buffUntil", "cBuffUntil"].forEach(k => { if (G[k] && G[k] <= t) { delete G[k]; say(k === "cBuffUntil" ? "L'effetto è finito." : "L'effetto del joint è finito."); render(); } });
  if (buffLeft() > 0) { const bt = $("buffTime"); if (bt) bt.textContent = timeStr(buffLeft() / 1000); $("jointTxt").textContent = timeStr(buffLeft() / 1000); }
  if (G.level >= CONFIG.police.minLevel) {
    if (!G.raidAt) scheduleFirstRaid();
    if ((G.raidPending != null || t >= G.raidAt) && raidReady()) {
      if (G.raidPending == null && G.money < 20 && goodsTotal() <= 0) scheduleRaid(); else startRaid();
    }
  }
  if (!nextGiftAt) scheduleGift();
  if (t >= nextGiftAt) { if (!document.querySelector(".gift") && $("menuOv").hidden && $("custOv").hidden && $("dailyOv").hidden) { spawnGift(); } scheduleGift(); }
  let changed = false;
  custs.forEach(c => { c.left -= dt * S; });
  const gone = custs.filter(c => c.left <= 0);
  if (gone.length) { custs = custs.filter(c => c.left > 0); changed = true; if (openCustId && !findCust(openCustId)) closeCust(); }
  custs.forEach(c => { const el = document.querySelector('.cav[data-cust="' + c.id + '"] .pat i'); if (el) el.style.setProperty("--w", (c.left / c.total * 100) + "%"); });
  if (labOpen && G.level >= LB().unlockLevel) {
    mcusts.forEach(c => { c.left -= dt * S; });
    if (mcusts.some(c => c.left <= 0)) { mcusts = mcusts.filter(c => c.left > 0); if (openCustId && !findCust(openCustId)) closeCust(); renderLabCusts(); }
    mcusts.forEach(c => { const el = document.querySelector('#labCusts .cav[data-cust="' + c.id + '"] .pat i'); if (el) el.style.setProperty("--w", (c.left / c.total * 100) + "%"); });
    if (mcusts.length < CONFIG.maxCustomers && t >= nextMKnock) { spawnMethCustomer(); nextMKnock = t + rnd(CONFIG.knockMin, CONFIG.knockMax) * mult("knockMul") * 1000 / S; }
    else if (mcusts.length >= CONFIG.maxCustomers) nextMKnock = Math.max(nextMKnock, t + 1000);
  }
  if (openCustId) { const c = findCust(openCustId), bar = $("cardPat"); if (c && bar) bar.style.setProperty("--w", (c.left / c.total * 100) + "%"); }
  if (custs.length < CONFIG.maxCustomers && t >= nextKnockAt) { spawnCustomer(); scheduleKnock(false); }
  else if (custs.length >= CONFIG.maxCustomers) nextKnockAt = Math.max(nextKnockAt, t + 1000);
  if (changed) renderCusts();
  // aggiorna i pulsanti Accetta se i grammi sono cambiati
}, 250);
setInterval(() => { if (playing && !document.hidden) save(); }, 15000);
document.addEventListener("visibilitychange", () => { musicSync(); if (document.hidden && G) { save(); pushRemote(); } });

/* scorciatoia per provare: tocca 5 volte "SIMULATOR" nella schermata iniziale (oppure apri il gioco con #lv20 in fondo al link) = livello 20 + 5000 € */
function cheatLevel(n) {
  if (!G) return; G.level = Math.max(G.level, n); G.xp = 0; G.money = Math.max(G.money, 5000); G.raidAt = 0; save(); render(); showTitle(); try { floatText("Livello " + G.level + " + 5000 €", $("w3"), "gold"); } catch (e) {}
}
(function () { let n = 0, tm = 0; $("w3").addEventListener("click", () => { n++; clearTimeout(tm); tm = setTimeout(() => { n = 0; }, 2500); if (n >= 5) { n = 0; cheatLevel(20); } }); })();
G = load();
applyPauseShift();
render(); showTitle();
initRemote();
if (/lv20/.test(location.hash)) cheatLevel(20);
try { if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
window.VSS = { startRaid, CONFIG, get G() { return G; }, render, spawnCustomer, addXp, save, get custs() { return custs; } };
